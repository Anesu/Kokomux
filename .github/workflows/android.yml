# The Android app: build the debug APK (to install from the phone), test the
# engine against kokoro-onnx, draw and tap through the screens, and check that
# the app's Python packages give the sounds engine.py gives in the container.
name: Android

on:
  push:
    paths:
      - "android/**"
      - "src/engine.py"
      - "src/words.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Chaquopy builds the app's Python packages with a Python of the same version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK, NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;30.0.16248370" "cmake;3.31.6" > /dev/null

      - name: Kokoro's model and voices, for the engine's tests
        uses: actions/cache@v6
        with:
          path: models
          key: kokoro-v1.0-fp32-dd4401a9-voices-v1.0

      - name: Download them if they aren't cached
        run: |
          mkdir -p models
          [ -s models/kokoro-v1.0-timestamped.fp32.onnx ] || curl -fsSL -o models/kokoro-v1.0-timestamped.fp32.onnx \
            https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX-timestamped/resolve/dd4401a9add81ac692d20e240d22ec9dda82cc29/onnx/model.onnx
          [ -s models/voices-v1.0.bin ] || curl -fsSL -o models/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      # Ming's host files (its tokenizer's tables and small tensors, 15 MB: its graphs run only
      # on the phone's NPU) and Qwen's files as the app downloads them (1.7 GB), for their tests.
      - name: Ming's host files and Qwen, for the engine's tests
        uses: actions/cache@v6
        with:
          path: |
            ming
            qwen
          key: ming-3db0f978-qwen-2b18c0a0-177cd39e

      - name: Download them if they aren't cached
        run: |
          mkdir -p ming qwen
          M=https://huggingface.co/litert-community/Ming-3.0-tts-0.5B/resolve/3db0f978908bc5f9c503850045853d8301e4b203
          for f in tokenizer_vocab.txt tokenizer_merges.txt tokenizer_added.txt char_classes.bin stop_head.bin istft_window.bin temb_epss10.bin; do
            [ -s ming/$f ] || curl -fsSL -o ming/$f $M/$f
          done
          Q=https://huggingface.co/onnx-community/Qwen3-TTS-12Hz-0.6B-Base/resolve/2b18c0a044a190e35f1a907779aa51cda0fb1fff/cpu_int4
          for f in text_embed talker_cache tok_decoder tok_encoder speaker_encoder; do
            [ -s qwen/$f.onnx ] || curl -fsSL -o qwen/$f.onnx $Q/$f.onnx
          done
          W=https://huggingface.co/wavekat/Qwen3-TTS-0.6B-Base-ONNX/resolve/177cd39e2ddab0d4d7ce5152a7abc2d382621158
          for f in int4/code_predictor.onnx int4/code_predictor.onnx.data embeddings/talker_codec_embedding.npy \
                   $(seq -f 'embeddings/cp_codec_embedding_%g.npy' 0 14); do
            [ -s qwen/$(basename $f) ] || curl -fsSL -o qwen/$(basename $f) $W/$f
          done

      - name: Test the engine and build the APK
        working-directory: android
        env:
          KOKOMUX_BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python
          KOKOMUX_MODELS: ${{ github.workspace }}/models
          KOKOMUX_MING: ${{ github.workspace }}/ming
          KOKOMUX_QWEN: ${{ github.workspace }}/qwen
        run: ./gradlew --console=plain :engine:test :app:testDebugUnitTest :app:assembleDebug

      - name: The APK's size
        run: |
          ls -l android/app/build/outputs/apk/debug/app-debug.apk |
            awk '{printf "app-debug.apk: %.1f MB\n", $5 / 1e6}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The screens, drawn by the tests
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: android/app/build/screens/

      - uses: actions/upload-artifact@v7
        with:
          name: kokomux-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The app's packages (Chaquopy's spaCy 3.8.7, thinc 8.3.4, numpy 1.26.2 on
      # Python 3.10) against the sounds the container's engine.py made.
      - name: Pronunciation and reading with the app's Python packages
        run: |
          python -m pip install --quiet uv
          python android/tools/wheels.py "$RUNNER_TEMP/wheels"
          echo "setuptools<70" > "$RUNNER_TEMP/build-constraints.txt"   # murmurhash 1.0.2 builds only with an older setuptools
          uv venv --quiet -p "$pythonLocation/bin/python" "$RUNNER_TEMP/mirror"
          VIRTUAL_ENV="$RUNNER_TEMP/mirror" uv pip install --quiet --build-constraints "$RUNNER_TEMP/build-constraints.txt" \
            --find-links "$RUNNER_TEMP/wheels" -r android/app/requirements.txt espeakng-loader==0.2.4
          "$RUNNER_TEMP/mirror/bin/python" android/tools/pronunciation.py | tee -a "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/mirror/bin/python" -I android/tools/test_text_side.py | tee -a "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/mirror/bin/python" -I android/tools/test_novels.py | tee -a "$GITHUB_STEP_SUMMARY"

  emulator:
    # The arm64 app on an x86_64 emulator, through Android's arm64 translation:
    # the pronunciation check, reading books, and a short text listened to
    # through the service, with Chaquopy, spaCy, the app's espeak-ng and Kokoro.
    name: The app on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK, NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;30.0.16248370" "cmake;3.31.6" > /dev/null

      - name: Kokoro's model and voices, for listening on the emulator
        uses: actions/cache@v6
        with:
          path: models
          key: kokoro-v1.0-fp32-dd4401a9-voices-v1.0

      - name: Download them if they aren't cached
        run: |
          mkdir -p models
          [ -s models/kokoro-v1.0-timestamped.fp32.onnx ] || curl -fsSL -o models/kokoro-v1.0-timestamped.fp32.onnx \
            https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX-timestamped/resolve/dd4401a9add81ac692d20e240d22ec9dda82cc29/onnx/model.onnx
          [ -s models/voices-v1.0.bin ] || curl -fsSL -o models/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        env:
          KOKOMUX_BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          disk-size: 6000M
          working-directory: android
          # The app's first screen (no model yet); then with the model put in its
          # storage, the screen once loaded and the log so far, and the tests.
          script: |
            ./gradlew --console=plain :app:installDebug
            adb shell pm grant kokomux.app android.permission.POST_NOTIFICATIONS
            adb shell am start -W -n kokomux.app/.MainActivity
            sleep 20
            adb exec-out screencap -p > "$RUNNER_TEMP/first-screen.png"
            adb shell am force-stop kokomux.app
            adb push "$GITHUB_WORKSPACE/models/kokoro-v1.0-timestamped.fp32.onnx" /data/local/tmp/model.onnx
            adb push "$GITHUB_WORKSPACE/models/voices-v1.0.bin" /data/local/tmp/voices.bin
            adb shell run-as kokomux.app mkdir -p files/models
            adb shell run-as kokomux.app cp /data/local/tmp/model.onnx files/models/kokoro-v1.0-timestamped.fp32.onnx
            adb shell run-as kokomux.app cp /data/local/tmp/voices.bin files/models/voices-v1.0.bin
            adb shell am start -W -n kokomux.app/.MainActivity
            sleep 90
            adb exec-out screencap -p > "$RUNNER_TEMP/ready-screen.png"
            adb logcat -d > "$RUNNER_TEMP/logcat.txt"
            ./gradlew --console=plain :app:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-screen
          path: |
            ${{ runner.temp }}/first-screen.png
            ${{ runner.temp }}/ready-screen.png
            ${{ runner.temp }}/logcat.txt
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
